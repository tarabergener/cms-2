<a class="list-group-item clearfix" style="cursor: pointer">
  <div class="pull-left">
    <h4 class="list-group-item-heading">{{ contact.name }}</h4>
  </div>
  <span class="pull-right">
    <img
      [src]="contact.imageUrl"
      alt="{{ contact.name }}"
      class="img-responsive"
      style="height: 40px; margin-right: 10px"
    />
  </span>
</a>
