<div class="row">
  <div class="col-xs-10">
    <div class="panel panel-default">
      <div class="panel-heading">
        <div class="row">
          <span class="title pad-left-right">Contacts</span>
        </div>
        <div class="row">
          <div class="input-group pull-left pad-left-right col-xs-7">
            <input #searchBox (keyup)="search(searchBox.value)">

            <div
              class="glyphicon glyphicon-search input-group-addon"
              (click)="search(searchBox.value)"
            ></div>
          </div>
        </div>
        <div class="pull-right pad-left-right">
          <a class="btn btn-success" [routerLink]="['new']">New Contact</a>
        </div>
      </div>
    </div>
    <div class="col-xs-12">
      <ul class="list-group">
        <cms-contact-item
          *ngFor="let contact of contacts | contactsFilter: term; let i = index"
          [contact]="contact"
          [index]="i"
        ></cms-contact-item>
      </ul>
    </div>
  </div>
</div>
