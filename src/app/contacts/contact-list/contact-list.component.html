<div class="row">
  <div class="col-xs-10">
    <div class="col-xs-12">
      <h2>Contacts</h2>
      <a [routerLink]="['new']" class="btn btn-primary">New Contact</a>
    </div>
    <div class="col-xs-12">
      <ul class="list-group">
        <cms-contact-item
          *ngFor="let contact of contacts"
          [contact]="contact"
        ></cms-contact-item>
      </ul>
    </div>
  </div>
</div>
