<div class="row">
  <div class="col-xs-10">
    <div class="col-xs-12">
      <h2>Contacts</h2>
      <button class="btn btn-primary">New Contact</button>
    </div>
    <div class="col-xs-12">
      <ul class="list-group">
        <a
          class="list-group-item"
          cursor="pointer"
          *ngFor="let contact of contacts"
        >
          {{ contact.name }}{{ contact.imageUrl }}
        </a>
      </ul>
    </div>
  </div>
</div>
