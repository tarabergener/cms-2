<div class="row">
  <div class="col-xs-10">
    <div class="col-xs-12">
      <h2>Contacts</h2>
      <button class="btn btn-primary">New Contact</button>
    </div>
    <div class="col-xs-12">
      <ul class="list-group">
        <cms-contact-item
          *ngFor="let contact of contacts"
          [contact]="contact"
          (click)="onSelected(contact)"
        ></cms-contact-item>
      </ul>
    </div>
  </div>
</div>
